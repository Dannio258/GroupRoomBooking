<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Room</title>
  </head>
  <body>
    <header>
      <nav>
        <li>
          <a href="index.html">Home</a>
          <a href="rooms.html">Rooms</a>
          <a href="book.html">Book a Room</a>
          <a href="bookings.html">My Bookings</a>
          <a href="contact.html">Contact</a>
        </li>
      </nav>
    </header>
    <main>
      <section>
        <h1>Book a Room</h1>
        <p>Please fill out the form below to book a room.</p>
        <form action="" method="post">
          <legend>Booking Form</legend>
          <fieldset>
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
            />
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
            <label for="number_of_people">Number of People:</label>
            <input
              type="number"
              id="number_of_people"
              name="number_of_people"
              placeholder="Enter the number of people"
              required
            />
            <label for="purpose">Purpose of Booking:</label>
            <input
              type="text"
              id="purpose"
              name="purpose"
              placeholder="Enter the purpose of the booking"
              required
            />
            <label for="room">Room:</label>
            <select id="room" name="room" required>
              <option value="">Select a room</option>
              <option value="room1">Room 1</option>
              <option value="room2">Room 2</option>
              <option value="room3">Room 3</option>
            </select>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required />
            <label for="time"> Start Time:</label>
            <input type="time" id="time" name="time" required />
            <label for="end_time">End Time:</label>
            <input type="time" id="end_time" name="end_time" required />
            <label for="terms">Accept Terms and Conditions:</label>
            <input type="checkbox" id="terms" name="terms" required />
            <button type="submit">Book Room</button>
          </fieldset>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Group Room Booking System. All rights reserved.</p>
    </footer>
  </body>
</html>
