<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-200 flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/80">
      <nav class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-5">
        <ul>
          <li
            class="list-none flex flex-wrap items-center justify-center gap-1 sm:gap-6"
          >
            <a
              href="index.html"
              class="rounded-lg bg-indigo-600 px-3 sm:px-4 py-2 text-sm sm:text-base font-medium text-white transition hover:bg-indigo-500"
            >
              Home
            </a>

            <a
              href="rooms.html"
              class="rounded-lg px-3 sm:px-4 py-2 text-sm sm:text-base font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"
            >
              Rooms
            </a>

            <a
              href="book.html"
              class="rounded-lg px-3 sm:px-4 py-2 text-sm sm:text-base font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"
            >
              Book a Room
            </a>

            <a
              href="bookings.html"
              class="rounded-lg px-3 sm:px-4 py-2 text-sm sm:text-base font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"
            >
              My Bookings
            </a>

            <a
              href="contact.html"
              class="rounded-lg px-3 sm:px-4 py-2 text-sm sm:text-base font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white"
            >
              Contact
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto px-3 sm:px-6 py-10 sm:py-16">
      <table
        class="block sm:table w-full rounded-2xl sm:overflow-hidden sm:border sm:border-slate-800 bg-transparent sm:bg-slate-900 text-left shadow-none sm:shadow-xl"
      >
        <thead
          class="hidden sm:table-header-group bg-slate-800 text-sm uppercase tracking-wide text-slate-300"
        >
          <tr>
            <th scope="col" class="px-5 py-4 font-semibold">Booking ID</th>
            <th scope="col" class="px-5 py-4 font-semibold">Name</th>
            <th scope="col" class="px-5 py-4 font-semibold">Email</th>
            <th scope="col" class="px-5 py-4 font-semibold">
              Number of People
            </th>
            <th scope="col" class="px-5 py-4 font-semibold">Purpose</th>
            <th scope="col" class="px-5 py-4 font-semibold">Room</th>
          </tr>
        </thead>

        <tbody
          id="bookingsTable"
          class="block sm:table-row-group sm:divide-y sm:divide-slate-800 text-slate-300"
        ></tbody>
      </table>
    </main>

    <footer class="border-t border-slate-800 bg-slate-900">
      <p
        class="max-w-6xl mx-auto px-3 sm:px-6 py-6 text-center text-sm text-slate-500"
      >
        &copy; 2026 Group Room Booking System. All rights reserved.
      </p>
    </footer>
  </body>
</html>
