<!doctype html>
<html lang="en" class="overflow-y-auto scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings</title>

    <script src="script.js"></script>

    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-screen bg-slate-50 text-slate-800 transition-colors dark:bg-slate-950 dark:text-slate-200 flex flex-col"
  >
    <header
      class="border-b border-slate-200 bg-white/80 dark:border-slate-800 dark:bg-slate-900/80"
    >
      <nav
        class="grid w-full grid-cols-[2.5rem_minmax(0,1fr)_2.5rem] items-center px-3 py-4 sm:px-6 sm:py-5"
      >
        <div></div>

        <ul>
          <li
            class="list-none flex flex-wrap items-center justify-center gap-1 sm:gap-6"
          >
            <a
              href="index.html"
              class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white sm:px-4 sm:text-base"
            >
              Home
            </a>

            <a
              href="rooms.html"
              class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white sm:px-4 sm:text-base"
            >
              Rooms
            </a>

            <a
              href="book.html"
              class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white sm:px-4 sm:text-base"
            >
              Book a Room
            </a>

            <a
              href="bookings.html"
              class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white sm:px-4 sm:text-base"
            >
              My Bookings
            </a>

            <a
              href="contact.html"
              class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white sm:px-4 sm:text-base"
            >
              Contact
            </a>
          </li>
        </ul>

        <button
          id="themeToggle"
          type="button"
          aria-label="Toggle dark and light mode"
          class="flex size-10 items-center justify-center justify-self-end rounded-lg text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
        >
          <svg
            class="size-5 dark:hidden"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75
                 c-5.385 0-9.75-4.365-9.75-9.75
                 0-1.33.266-2.597.748-3.752
                 A9.753 9.753 0 1 0 21.752 15.002Z"
            />
          </svg>

          <svg
            class="hidden size-5 dark:block"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3
                 m15.364-6.364-1.06 1.06
                 M6.697 17.303l-1.061 1.061
                 m12.728 0-1.06-1.06
                 M6.697 6.697 5.636 5.636
                 M15.75 12a3.75 3.75 0 1 1-7.5 0
                 3.75 3.75 0 0 1 7.5 0Z"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main
      class="flex-1 w-full max-w-[min(100%-1.5rem,90rem)] mx-auto px-3 sm:px-6 py-10 sm:py-16"
    >
      <table
        class="block 2xl:table 2xl:table-auto w-full max-w-full rounded-2xl 2xl:overflow-hidden 2xl:border 2xl:border-slate-200 bg-transparent 2xl:bg-white text-center shadow-none 2xl:shadow-xl dark:2xl:border-slate-800 dark:2xl:bg-slate-900"
      >
        <thead
          class="hidden 2xl:table-header-group bg-slate-100 text-center text-sm uppercase tracking-wide text-slate-600 dark:bg-slate-800 dark:text-slate-300"
        >
          <tr>
            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Booking ID
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Name
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Email
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Number of People
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Purpose
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Room
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Date
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              Start Time
            </th>

            <th scope="col" class="px-3 py-4 font-semibold whitespace-nowrap">
              End Time
            </th>

            <th
              scope="col"
              class="px-5 py-4 font-semibold whitespace-nowrap"
            ></th>
          </tr>
        </thead>

        <tbody
          id="bookingsTable"
          class="block 2xl:table-row-group 2xl:divide-y 2xl:divide-slate-200 text-slate-700 dark:2xl:divide-slate-800 dark:text-slate-300"
        ></tbody>
      </table>
    </main>

    <footer
      class="border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"
    >
      <p
        class="max-w-6xl mx-auto px-3 sm:px-6 py-6 text-center text-sm text-slate-500"
      >
        &copy; 2026 Group Room Booking System. All rights reserved.
      </p>
    </footer>
  </body>
</html>
